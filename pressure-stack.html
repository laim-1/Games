<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pressure Stack">
<meta name="theme-color" content="#2b1d6b">
<meta name="format-detection" content="telephone=no">
<title>Pressure Stack</title>
<link rel="manifest" href="pressure-stack.webmanifest">
<link rel="icon" href="pressure-stack-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="pressure-stack-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
:root{--ink:#1d1240;--pink:#ff4f8b;--yellow:#ffd23f;--mint:#3ee0a1;--blue:#3fa9ff;--purple:#5b3cf0;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;position:fixed;inset:0;width:100%;
background:linear-gradient(#5b3cf0,#2b1d6b);font-family:'Fredoka',system-ui,sans-serif;font-weight:700;color:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
padding:calc(var(--st) + 20px) calc(var(--sr) + 22px) calc(var(--sb) + 20px) calc(var(--sl) + 22px);text-align:center;z-index:10}
.screen.show{display:flex}
.dim{background:rgba(29,18,64,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
h1,.big{font-family:'Lilita One','Fredoka',sans-serif;font-weight:400;margin:0;letter-spacing:1px;
text-shadow:0 5px 0 var(--ink),0 0 2px var(--ink)}
h1{font-size:clamp(44px,15vw,72px);line-height:.92;color:var(--yellow);-webkit-text-stroke:2px var(--ink)}
h1 span{color:var(--pink);display:block}
.big{font-size:clamp(30px,10vw,46px)}
p{margin:0;font-size:18px;line-height:1.3;max-width:340px;opacity:.95}
.btn{font-family:'Lilita One',sans-serif;font-size:28px;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);
border-radius:22px;padding:14px 34px;box-shadow:0 7px 0 var(--ink);cursor:pointer;min-width:220px;transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.mint{background:var(--mint)}
.btn.small{font-size:20px;padding:8px 18px;min-width:0;border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.seg{display:flex;gap:10px}
.seg button{font-family:'Lilita One',sans-serif;font-size:30px;width:70px;height:70px;border-radius:20px;border:4px solid var(--ink);
background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--ink)}
.seg button.on{background:var(--pink);color:#fff}
.names{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px}
.names input{font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;padding:12px 16px;border-radius:16px;
border:4px solid var(--ink);outline:none;color:var(--ink);-webkit-user-select:text;user-select:text;width:100%}
.names .row{display:flex;align-items:center;gap:10px}
.swatch{width:26px;height:26px;border-radius:8px;border:3px solid var(--ink);flex:none}
.stackart{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px}
.stackart div{border:4px solid var(--ink);border-radius:10px}
.tri{width:0;height:0;border-left:30px solid transparent!important;border-right:30px solid transparent!important;border-bottom:50px solid var(--mint)!important;border-top:0!important;border-radius:0!important}
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:none;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 0 calc(var(--sl) + 10px);pointer-events:none}
#hud.show{display:block}
.players{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pc{background:rgba(255,255,255,.95);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:4px 9px;min-width:72px;
font-size:14px;line-height:1.15;box-shadow:0 3px 0 var(--ink);transition:transform .2s}
.pc.cur{transform:translateY(3px) scale(1.07);background:var(--yellow)}
.pc.out{opacity:.4;text-decoration:line-through}
.pc .nm{font-family:'Lilita One',sans-serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.lives{display:flex;gap:3px;justify-content:center;margin-top:2px}
.life{width:11px;height:11px;border-radius:50%;background:var(--pink);border:2px solid var(--ink)}
.life.gone{background:#ccc}
.bar{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px}
.tag{font-family:'Lilita One',sans-serif;font-size:20px;background:var(--ink);border-radius:14px;padding:4px 12px;color:#fff}
.tag b{color:var(--yellow);font-weight:400}
#turnmsg{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 18px);z-index:5;text-align:center;pointer-events:none;display:none}
#turnmsg.show{display:block}
#turnmsg .big{font-size:26px}
#turnmsg p{margin:4px auto 0;font-size:16px}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:20;opacity:0;pointer-events:none;
font-family:'Lilita One',sans-serif;font-size:44px;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);
transition:all .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.meter{width:240px;height:34px;border-radius:17px;background:#fff;border:4px solid var(--ink);position:relative;overflow:hidden}
.meter .safe{position:absolute;left:30%;right:30%;top:0;bottom:0;background:var(--mint)}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:12px;margin-left:-6px;left:50%;background:var(--ink);border-radius:6px}
#pass.dim{background:rgba(29,18,64,.45);backdrop-filter:none;-webkit-backdrop-filter:none;justify-content:flex-end;padding-bottom:calc(var(--sb) + 34px)}
.card{background:rgba(29,18,64,.9);border:4px solid #fff;border-radius:26px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.pname{color:var(--yellow)}
.rank{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.rank div{display:flex;justify-content:space-between;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-size:18px}
.crown{width:90px;height:60px;background:var(--yellow);border:4px solid var(--ink);clip-path:polygon(0 100%,0 20%,25% 55%,50% 0,75% 55%,100% 20%,100% 100%)}
.note{font-size:14px;opacity:.75}
.hubbtn{position:absolute;z-index:30;top:calc(var(--st) + 10px);left:calc(var(--sl) + 10px);display:flex;align-items:center;gap:6px;
font-family:'Lilita One',sans-serif;font-size:16px;color:#fff;background:rgba(29,18,64,.85);border:3px solid #fff;border-radius:14px;padding:6px 12px 6px 9px;text-decoration:none;pointer-events:auto}
.hubbtn i{width:10px;height:10px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(45deg);display:block}
#hubMini{top:auto;bottom:calc(var(--sb) + 10px);font-size:13px;padding:4px 9px 4px 7px;display:none}
#hubMini.show{display:flex}
#tiltWrap{position:absolute;z-index:31;right:calc(var(--sr) + 10px);top:calc(var(--st) + 128px);display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:70vw;pointer-events:none}
#tiltInd{display:flex;align-items:center;gap:6px;background:rgba(29,18,64,.85);border:3px solid #fff;border-radius:14px;padding:4px 8px;font-family:'Lilita One',sans-serif;font-size:13px;opacity:.55}
#tiltInd.on{opacity:1}
#tiltInd .tb{width:84px;height:12px;border-radius:6px;background:#fff;position:relative;overflow:hidden}
#tiltInd .tz{position:absolute;left:43%;right:43%;top:0;bottom:0;background:var(--mint)}
#tiltInd .tn{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;left:50%;background:var(--ink);border-radius:3px}
#tiltInd.hot .tb{background:var(--pink)}
#tiltInd .tv{min-width:30px;text-align:right}
#tiltBtn{pointer-events:auto;display:none;font-family:'Lilita One',sans-serif;font-size:14px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:0 4px 0 var(--ink)}
#tiltHelp{display:none;font-size:12px;line-height:1.25;background:rgba(29,18,64,.92);border:2px solid var(--yellow);border-radius:10px;padding:6px 8px;text-align:right}
#hubMini{right:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud"><div class="players" id="players"></div>
<div class="bar"><div class="tag">HEIGHT <b id="height">0</b>m</div><div class="tag">BEST <b id="best">0</b>m</div></div></div>
<div id="turnmsg"><div class="big" id="turnname"></div><p id="turnhint"></p></div>
<div id="toast"></div>
<a class="hubbtn" id="hubMini" href="hub.html"><i></i>HUB</a>
<div id="tiltWrap"><div id="tiltInd"><span class="tl">TILT</span><div class="tb"><div class="tz"></div><div class="tn" id="tiltNeedle"></div></div><span class="tv" id="tiltVal">--</span></div>
<button id="tiltBtn" type="button">TILT OFF - TAP TO ENABLE</button><div id="tiltHelp"></div></div>

<div class="screen show" id="start">
  <a class="hubbtn" href="hub.html"><i></i>HUB</a>
  <div class="stackart"><div class="tri"></div><div style="width:90px;height:44px;background:var(--yellow);transform:rotate(-5deg)"></div><div style="width:140px;height:46px;background:var(--pink)"></div><div style="width:200px;height:14px;background:#fff;border-radius:6px"></div></div>
  <h1>PRESSURE<span>STACK</span></h1>
  <p>Stack the tower. Pass the phone. Don't let it fall.</p>
  <button class="btn pink" id="playBtn">TAP TO PLAY</button>
  <p class="note" id="permNote">Tilt controls need motion access on iPhone.</p>
</div>

<div class="screen dim" id="setup">
  <a class="hubbtn" href="hub.html"><i></i>HUB</a>
  <div class="big">HOW MANY?</div>
  <div class="seg" id="seg"><button data-n="2" class="on">2</button><button data-n="3">3</button><button data-n="4">4</button></div>
  <div class="names" id="names"></div>
  <button class="btn" id="goBtn">START</button>
  <p class="note" id="ctrlNote"></p>
</div>

<div class="screen dim" id="pass">
  <div class="card">
    <div class="big">PASS TO <span class="pname" id="passName"></span></div>
    <p id="passHint">Careful! Tilting moves the tower.</p>
    <div class="meter" id="meter"><div class="safe"></div><div class="needle" id="needle"></div></div>
    <button class="btn mint" id="gotBtn">I'VE GOT IT</button>
  </div>
</div>

<div class="screen dim" id="over">
  <div class="crown"></div>
  <div class="big"><span class="pname" id="winName"></span> WINS!</div>
  <div class="rank" id="rank"></div>
  <button class="btn pink" id="againBtn">PLAY AGAIN</button>
  <button class="btn small" id="menuBtn">NEW PLAYERS</button>
  <a class="btn small" href="hub.html" style="text-decoration:none">BACK TO HUB</a>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const COLORS=['#ff4f8b','#ffd23f','#3ee0a1','#3fa9ff','#ff8a3d','#b46bff'];
const PCOL=['#ff4f8b','#3fa9ff','#3ee0a1','#ff8a3d'];
const hasMatter=typeof Matter!=='undefined';
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;}
addEventListener('resize',resize);resize();
// Block page gestures
['gesturestart','gesturechange','dblclick'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON')e.preventDefault();lastTouch=n},{passive:false});

// ---------- Tilt ----------
let tiltOK=false,tiltState='off',gamma=0,gammaS=0,gotOrientation=false,lastOrientT=0,noEvtTimer=0;
function screenAngle(){const o=screen.orientation;if(o&&typeof o.angle==='number')return o.angle;return typeof window.orientation==='number'?window.orientation:0;}
function onOrient(e){if(e.gamma==null&&e.beta==null)return;
  const a=((screenAngle()%360)+360)%360;let v=e.gamma||0;
  if(a===90)v=-(e.beta||0);else if(a===270)v=(e.beta||0);else if(a===180)v=-(e.gamma||0);
  // past ~90deg gamma flips; clamp
  gamma=Math.max(-80,Math.min(80,v));
  if(!gotOrientation){gotOrientation=true;tiltUI();}lastOrientT=performance.now();}
function attachTilt(){removeEventListener('deviceorientation',onOrient);addEventListener('deviceorientation',onOrient);tiltOK=true;tiltState='waiting';
  clearTimeout(noEvtTimer);noEvtTimer=setTimeout(()=>{if(!gotOrientation){tiltState='noevents';tiltUI();}},1500);tiltUI();}
// MUST be called synchronously inside a tap handler: requestPermission is the first thing invoked (no await before it).
function requestTilt(){
  if(typeof DeviceOrientationEvent==='undefined'){tiltState='unavailable';tiltUI();return Promise.resolve(false);}
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    let pr;try{pr=DeviceOrientationEvent.requestPermission();}catch(err){tiltState='denied';tiltUI();return Promise.resolve(false);}
    return pr.then(r=>{if(r==='granted'){attachTilt();return true;}tiltState='denied';tiltUI();return false;})
             .catch(()=>{tiltState='denied';tiltUI();return false;});
  }
  attachTilt();return Promise.resolve(true);
}
function tiltUI(){
  const b=$('tiltBtn'),h=$('tiltHelp');if(!b)return;
  const on=tiltActive();
  if(on)tiltState='on';
  b.style.display=on||tiltState==='waiting'?'none':'flex';
  b.textContent=tiltState==='unavailable'?'TILT UNAVAILABLE - USE DRAG':'TILT OFF - TAP TO ENABLE';
  h.style.display=tiltState==='noevents'||tiltState==='denied'?'block':'none';
  h.textContent=tiltState==='denied'?'Motion access was denied. Tap the button to retry; if no prompt appears, close and reopen this page.':
    'No motion data yet. On iPhone check Settings > Safari > Motion & Orientation Access is on, then reload.';
  $('tiltInd').classList.toggle('on',on);
}
function tiltActive(){return tiltOK&&gotOrientation;}
const TILT_STRENGTH=0.6,DEADZONE=3;
function tiltG(){if(!tiltActive())return 0;const a=Math.abs(gammaS);if(a<DEADZONE)return 0;return Math.sign(gammaS)*Math.min(1,(a-DEADZONE)/42);}

// ---------- Audio (tiny synth) ----------
let actx=null;
function beep(f=440,d=.08,type='square',v=.06){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(_){}}
function buzz(ms){if(navigator.vibrate)navigator.vibrate(ms);}

// ---------- State ----------
let players=[],cur=0,nPlayers=2,best=+(localStorage.getItem('ps_best')||0);
let phase='menu'; // aim, fall, settle, pass, over
let engine=null,world=null,platform=null,blocks=[],active=null;
let camY=0,camTarget=0,towerTop=0,phaseT=0,stillT=0,targetX=0,dragging=false,downX=0,downY=0,downT=0,shake=0;
let particles=[],nextShape=null,hint='',penalized=false;
const PLAT_W=230,PLAT_Y=0;

function namesUI(){
  const box=$('names');const old=[...box.querySelectorAll('input')].map(i=>i.value);box.innerHTML='';
  for(let i=0;i<nPlayers;i++){const r=document.createElement('div');r.className='row';
    r.innerHTML=`<div class="swatch" style="background:${PCOL[i]}"></div><input maxlength="10" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Player ${i+1}">`;
    const inp=r.querySelector('input');inp.value=old[i]||(localStorage.getItem('ps_n'+i)||'');box.appendChild(r);}
}
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;nPlayers=+b.dataset.n;
  [...$('seg').children].forEach(c=>c.classList.toggle('on',c===b));namesUI();beep(600);});
function show(id){['start','setup','pass','over'].forEach(s=>$(s).classList.toggle('show',s===id));}

$('tiltBtn').addEventListener('click',e=>{e.stopPropagation();gotOrientation=false;requestTilt();});
$('hubMini').addEventListener('click',e=>{if(!confirm('Leave this game and go back to the hub?'))e.preventDefault();});
$('playBtn').addEventListener('click',()=>{
  const pr=requestTilt();beep(520,.1);
  pr.then(()=>{$('ctrlNote').textContent=tiltOK?'Tilt controls ON: tilt to steer, tap to drop.':'Touch controls: drag to aim, release to drop.';});
  setTimeout(()=>{$('ctrlNote').textContent=tiltActive()?'Tilt controls ON: tilt to steer, tap to drop.':'Touch controls: drag to aim, release to drop.';},400);
  $('ctrlNote').textContent=tiltOK?'Tilt controls ON: tilt to steer, tap to drop.':'Touch controls: drag to aim, release to drop.';
  namesUI();show('setup');
});
$('goBtn').addEventListener('click',()=>{
  const ins=[...$('names').querySelectorAll('input')];
  players=ins.map((inp,i)=>{const n=(inp.value.trim()||('Player '+(i+1))).slice(0,10).toUpperCase();localStorage.setItem('ps_n'+i,inp.value.trim());
    return{name:n,lives:3,score:0,out:false,color:PCOL[i]}});
  document.activeElement&&document.activeElement.blur();beep(700,.12);startGame();
});
$('againBtn').addEventListener('click',()=>{players.forEach(p=>{p.lives=3;p.score=0;p.out=false});startGame();});
$('menuBtn').addEventListener('click',()=>{phase='menu';$('hud').classList.remove('show');$('hubMini').classList.remove('show');show('setup');namesUI();});
$('gotBtn').addEventListener('click',()=>{if(phase!=='pass')return;beep(660,.1);nextTurn();});

// ---------- Physics ----------
function makeWorld(){
  if(engine){Matter.World.clear(engine.world,false);Matter.Engine.clear(engine);}
  engine=Matter.Engine.create({enableSleeping:false});engine.positionIterations=10;engine.velocityIterations=8;world=engine.world;
  engine.gravity.y=1;engine.gravity.x=0;
  platform=Matter.Bodies.rectangle(0,PLAT_Y+15,PLAT_W,30,{isStatic:true,friction:.6,chamfer:{radius:8},label:'plat'});
  Matter.World.add(world,platform);blocks=[];active=null;particles=[];
}
function randShape(){
  const r=Math.random(),c=COLORS[(Math.random()*COLORS.length)|0];
  const s=0.8+Math.random()*0.55;
  if(r<.30)return{k:'rect',w:(60+Math.random()*70)*s|0,h:(26+Math.random()*22)*s|0,c};
  if(r<.45)return{k:'rect',w:46*s|0,h:46*s|0,c};
  if(r<.58)return{k:'poly',n:3,r:34*s,c};
  if(r<.70)return{k:'trap',w:(80+Math.random()*40)*s|0,h:36*s|0,sl:.45,c};
  if(r<.80)return{k:'poly',n:6,r:28*s,c};
  if(r<.88)return{k:'poly',n:5,r:30*s,c};
  if(r<.94)return{k:'L',s:22*s,c};
  return{k:'circ',r:22*s,c};
}
function makeBody(sh,x,y){
  const o={friction:.45,frictionStatic:.6,restitution:.02,density:.0018,chamfer:{radius:5}};
  let b;
  if(sh.k==='rect')b=Matter.Bodies.rectangle(x,y,sh.w,sh.h,o);
  else if(sh.k==='poly')b=Matter.Bodies.polygon(x,y,sh.n,sh.r,o);
  else if(sh.k==='trap')b=Matter.Bodies.trapezoid(x,y,sh.w,sh.h,sh.sl,o);
  else if(sh.k==='circ')b=Matter.Bodies.circle(x,y,sh.r,{friction:.6,frictionStatic:.8,density:.0018,restitution:0});
  else{const s=sh.s;const a=Matter.Bodies.rectangle(x,y,s*3,s,{chamfer:{radius:4}}),bb=Matter.Bodies.rectangle(x-s,y-s,s,s,{chamfer:{radius:4}});
    b=Matter.Body.create({parts:[a,bb],friction:.45,frictionStatic:.6,restitution:.02});Matter.Body.setDensity(b,.0018);}
  if(sh.k==='poly'&&sh.n===3)Matter.Body.setAngle(b,-Math.PI/2);
  b.color=sh.c;b.owner=cur;return b;
}
function computeTop(){let t=PLAT_Y;for(const b of blocks){if(b===active&&phase!=='settle'&&phase!=='pass')continue;if(Math.abs(b.position.x)<PLAT_W&&b.bounds.min.y<t&&b.bounds.max.y<PLAT_Y+40)t=b.bounds.min.y;}return t;}
function heightM(){return Math.max(0,(PLAT_Y-towerTop)/40);}

function startGame(){
  if(!hasMatter){alert('Could not load physics library. Check your connection.');return;}
  makeWorld();cur=0;show(null);$('hud').classList.add('show');$('hubMini').classList.add('show');towerTop=PLAT_Y;camY=camTarget=PLAT_Y-H*0.72;
  nextShape=randShape();beginTurn();
}
function spawnY(){return Math.min(towerTop,PLAT_Y)-Math.max(170,H*0.32);}
function beginTurn(){
  phase='aim';phaseT=0;penalized=false;
  const sh=nextShape;nextShape=randShape();
  active=makeBody(sh,0,spawnY());Matter.Body.setStatic(active,true);active.shape=sh;Matter.World.add(world,active);
  targetX=0;updateHUD();
  $('turnname').innerHTML=`<span style="color:${players[cur].color}">${esc(players[cur].name)}</span>'S TURN`;
  $('turnhint').textContent=tiltActive()?'Tilt to steer. Tap to drop!':'Drag to aim. Release to drop!';
  $('turnmsg').classList.add('show');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function drop(){
  if(phase!=='aim'||!active)return;
  Matter.Body.setStatic(active,false);Matter.Body.setVelocity(active,{x:0,y:2});
  blocks.push(active);phase='fall';phaseT=0;stillT=0;beep(380,.08,'triangle',.08);
  $('turnhint').textContent=tiltActive()?'Steer it as it falls!':'Drag to steer as it falls!';
}
function updateHUD(){
  const box=$('players');box.innerHTML='';
  players.forEach((p,i)=>{const d=document.createElement('div');d.className='pc'+(i===cur&&phase!=='over'?' cur':'')+(p.out?' out':'');
    d.style.borderBottomColor=p.color;
    let l='';for(let k=0;k<3;k++)l+=`<div class="life${k<p.lives?'':' gone'}"></div>`;
    d.innerHTML=`<div class="nm" style="color:${p.color};-webkit-text-stroke:.5px #1d1240">${esc(p.name)}</div><div>${p.score} pts</div><div class="lives">${l}</div>`;box.appendChild(d);});
  $('height').textContent=heightM().toFixed(1);$('best').textContent=best.toFixed(1);
}
function toast(t,c){const e=$('toast');e.textContent=t;e.style.color=c||'#ff4f8b';e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1100);}
function burst(x,y,c,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-1,l:1,c:c||COLORS[i%COLORS.length],s:4+Math.random()*6});}

function loseLife(who,fallen){
  const p=players[who];p.lives--;shake=14;buzz([80,40,120]);beep(160,.35,'sawtooth',.08);
  fallen.forEach(b=>{burst(b.position.x,Math.min(b.position.y,PLAT_Y+60),b.color,10);Matter.World.remove(world,b);});
  blocks=blocks.filter(b=>!fallen.includes(b));
  if(p.lives<=0){p.out=true;p.lives=0;toast(p.name+' IS OUT!');}else toast('-1 LIFE: '+p.name);
  updateHUD();
}
function aliveCount(){return players.filter(p=>!p.out).length;}
function nextAlive(i){for(let k=1;k<=players.length;k++){const j=(i+k)%players.length;if(!players[j].out)return j;}return i;}
function checkFallen(){return blocks.filter(b=>b.position.y>PLAT_Y+120||Math.abs(b.position.x)>W*1.5);}
function endTurnSuccess(){
  const p=players[cur];towerTop=computeTop();const h=heightM();
  const pts=10+Math.round(h*2);p.score+=pts;burst(active.position.x,active.bounds.min.y,null,10);beep(880,.08,'square',.05);setTimeout(()=>beep(1175,.1,'square',.05),80);
  if(h>best){best=h;localStorage.setItem('ps_best',best.toFixed(1));}
  toast('+'+pts,'#3ee0a1');active=null;
  if(aliveCount()<=1)return gameOver();
  phase='pass';phaseT=0;penalized=false;updateHUD();$('turnmsg').classList.remove('show');
  const nx=nextAlive(cur);$('passName').textContent=players[nx].name;$('passName').style.color=players[nx].color;
  $('passHint').textContent=tiltActive()?'Hand it over gently! Tilting pushes the tower.':'Hand it over! (Tilt drift is off without motion access.)';
  show('pass');
}
function afterFail(){
  active=null;towerTop=computeTop();
  if(aliveCount()<=1)return gameOver();
  phase='pass';phaseT=0;$('turnmsg').classList.remove('show');
  const nx=nextAlive(cur);$('passName').textContent=players[nx].name;$('passName').style.color=players[nx].color;
  $('passHint').textContent=tiltActive()?'Hand it over gently! Tilting pushes the tower.':'Hand it over carefully!';
  setTimeout(()=>{if(phase==='pass')show('pass');},700);
  setTimeout(()=>{if(phase==='pass')penalized=false;},1500);
}
function nextTurn(){show(null);cur=nextAlive(cur);
  for(const b of blocks)Matter.Body.setVelocity(b,{x:b.velocity.x*.3,y:b.velocity.y*.3});beginTurn();}
function gameOver(){
  phase='over';engine.gravity.x=0;$('turnmsg').classList.remove('show');updateHUD();
  const alive=players.filter(p=>!p.out);const w=alive.length?alive[0]:[...players].sort((a,b)=>b.score-a.score)[0];
  $('winName').textContent=w.name;$('winName').style.color=w.color;
  const r=[...players].sort((a,b)=>(b.out?0:1)-(a.out?0:1)||b.score-a.score);
  $('rank').innerHTML=r.map((p,i)=>`<div><span>${i+1}. <span style="color:${p.color}">${esc(p.name)}</span></span><span>${p.score} pts</span></div>`).join('')+
    `<div><span>TOWER</span><span>${heightM().toFixed(1)} m</span></div>`;
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,'square',.05),i*120));
  setTimeout(()=>show('over'),900);
}

// ---------- Input ----------
function toWorldX(cx){return cx-W/2;}
cv.addEventListener('pointerdown',e=>{if(phase!=='aim'&&phase!=='fall')return;dragging=true;downX=e.clientX;downY=e.clientY;downT=performance.now();
  if(!tiltActive())targetX=toWorldX(e.clientX);});
cv.addEventListener('pointermove',e=>{if(!dragging)return;if(!tiltActive()||Math.abs(e.clientX-downX)>12)targetX=toWorldX(e.clientX);});
addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;if(phase==='aim')drop();});
addEventListener('pointercancel',()=>dragging=false);
let keyDir=0;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keyDir=-1;if(e.key==='ArrowRight')keyDir=1;if(e.key===' '&&phase==='aim')drop();});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keyDir=0;});

// ---------- Loop ----------
const STEP=1000/60;let acc=0,last=performance.now();
function step(dt){
  gammaS+=(gamma-gammaS)*.25;
  if(tiltActive()&&performance.now()-lastOrientT>3000&&tiltState==='on'){} 
  const ind=$('tiltNeedle');if(ind){ind.style.left=(50+Math.max(-48,Math.min(48,gammaS/45*48)))+'%';$('tiltVal').textContent=tiltActive()?(gammaS>=0?'+':'')+Math.round(gammaS)+'°':'--';
    $('tiltInd').classList.toggle('hot',Math.abs(tiltG())>.45);}
  if(!engine||phase==='menu')return;
  phaseT+=dt;
  // tilt gravity applies whenever the tower exists (aim, fall, settle, pass)
  const gx=phase==='over'?0:tiltG()*TILT_STRENGTH;
  if(Math.abs(gx-engine.gravity.x)>0.002){engine.gravity.x=gx;for(const b of blocks)if(b.isSleeping)Matter.Sleeping.set(b,false);}
  const lim=Math.min(W/2-30,PLAT_W*0.95);
  if(keyDir)targetX=Math.max(-lim,Math.min(lim,targetX+keyDir*5));
  if(tiltActive()&&!dragging&&(phase==='aim'||phase==='fall'))targetX=Math.max(-lim,Math.min(lim,gammaS*6));
  targetX=Math.max(-lim,Math.min(lim,targetX));
  if(phase==='aim'&&active){
    const nx=active.position.x+(targetX-active.position.x)*.25;
    Matter.Body.setPosition(active,{x:nx,y:spawnY()+Math.sin(phaseT/300)*4});
  }
  if(phase==='fall'&&active){
    const dx=targetX-active.position.x;Matter.Body.setVelocity(active,{x:active.velocity.x+(Math.max(-6,Math.min(6,dx*.08))-active.velocity.x)*.15,y:active.velocity.y});
    const near=blocks.some(b=>b!==active&&Matter.Collision.collides(active,b))||Matter.Collision.collides(active,platform);
    if(near||active.position.y>PLAT_Y+40||phaseT>5000){phase='settle';phaseT=0;stillT=0;beep(220,.05,'triangle',.06);$('turnhint').textContent='Settling...';}
  }
  if(phase==='pass'){
    // gentle drift from tilt
    const g=tiltG();
    const nd=$('needle');nd.style.left=(50+Math.max(-48,Math.min(48,g*50)))+'%';
    $('meter').style.background=Math.abs(g)>.4?'#ff4f8b':'#fff';
  }
  Matter.Engine.update(engine,STEP);
  // fallen detection
  if(phase==='aim'||phase==='fall'||phase==='settle'||phase==='pass'){
    const f=checkFallen();
    if(f.length){const wasActive=f.includes(active);
      if(penalized){ // one life max per turn / per hand-off; clear extra debris quietly
        f.forEach(b=>{burst(b.position.x,Math.min(b.position.y,PLAT_Y+60),b.color,6);Matter.World.remove(world,b);});blocks=blocks.filter(b=>!f.includes(b));
      }else{penalized=true;loseLife(cur,f);}
      towerTop=computeTop();
      if(phase==='pass'){if(aliveCount()<=1){show(null);return gameOver();}
        $('passName').textContent=players[nextAlive(cur)].name;}
      else if(phase==='aim'){if(players[cur].out){Matter.World.remove(world,active);active=null;afterFail();}}
      else if(wasActive||phase==='settle'){if(active)Matter.World.remove(world,active);blocks=blocks.filter(b=>b!==active);afterFail();}
      return;}
  }
  if(phase==='settle'){
    let maxV=0;for(const b of blocks)maxV=Math.max(maxV,b.speed,Math.abs(b.angularVelocity)*20);
    stillT=maxV<0.25?stillT+dt:0;
    if(stillT>550||phaseT>4500)endTurnSuccess();
  }
  if(phase!=='aim'&&phase!=='fall')towerTop+= (computeTop()-towerTop)*.1;
}
function frame(now){
  let dt=Math.min(100,now-last);last=now;acc+=dt;
  let n=0;while(acc>=STEP&&n<4){step(STEP);acc-=STEP;n++;}if(n===4)acc=0;
  draw(now);requestAnimationFrame(frame);
}

// ---------- Render ----------
function roundPoly(verts){ctx.beginPath();verts.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();}
function drawBody(b,alpha){
  ctx.globalAlpha=alpha||1;
  const parts=b.parts.length>1?b.parts.slice(1):[b];
  ctx.lineJoin='round';
  for(const p of parts){ // shadow
    ctx.save();ctx.translate(0,5);roundPoly(p.vertices);ctx.fillStyle='rgba(29,18,64,.35)';ctx.fill();ctx.restore();}
  for(const p of parts){
    if(b.circleRadius){ctx.beginPath();ctx.arc(b.position.x,b.position.y,b.circleRadius,0,7);}else roundPoly(p.vertices);
    ctx.fillStyle=b.color;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#1d1240';ctx.stroke();}
  // highlight + face
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-6,-6,7,4,-.5,0,7);ctx.fill();
  ctx.fillStyle='#1d1240';const sc=b.circleRadius?0.8:1;
  ctx.beginPath();ctx.arc(-6*sc,1,2.6,0,7);ctx.arc(6*sc,1,2.6,0,7);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
}
let bgStars=[];for(let i=0;i<40;i++)bgStars.push({x:Math.random(),y:Math.random()*3000,s:1+Math.random()*2.5});
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // camera
  if(engine){camTarget=Math.min(PLAT_Y-H*0.72,Math.min(towerTop,PLAT_Y)-H*0.30-Math.max(170,H*0.32)+120);camY+=(camTarget-camY)*.06;}
  const hgt=Math.max(0,-camY-H*0.72)/1500;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${250-hgt*40},75%,${Math.max(18,52-hgt*20)}%)`);g.addColorStop(1,`hsl(${265-hgt*30},60%,${Math.max(12,30-hgt*10)}%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // parallax dots
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(const s of bgStars){const y=((s.y-camY*.3)%3000+3000)%3000;if(y<H){ctx.beginPath();ctx.arc(s.x*W,y,s.s,0,7);ctx.fill();}}
  // clouds
  ctx.fillStyle='rgba(255,255,255,.12)';
  for(let i=0;i<5;i++){const y=((i*420-camY*.5)%2100+2100)%2100-200;const x=((i*137+now*.01*(i%2?1:-1))%(W+200)+W+200)%(W+200)-100;
    ctx.beginPath();ctx.ellipse(x,y,70,26,0,0,7);ctx.ellipse(x+40,y-12,46,24,0,0,7);ctx.fill();}
  if(!engine){ // menu idle art
    return;}
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=.88;if(shake<.5)shake=0;}
  ctx.save();ctx.translate(W/2+sx,-camY+sy);
  // tilt tint during pass
  // ground / pillar
  ctx.fillStyle='#1d1240';ctx.fillRect(-60,PLAT_Y+28,120,2000);
  ctx.fillStyle='#3a2a8a';ctx.fillRect(-44,PLAT_Y+28,88,2000);
  // height marks
  ctx.font="16px 'Lilita One',sans-serif";ctx.textAlign='left';
  for(let m=5;m<400;m+=5){const y=PLAT_Y-m*40;if(y<camY-20)break;if(y>camY+H+20)continue;
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.setLineDash([8,10]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-W/2,y);ctx.lineTo(W/2,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText(m+'m',-W/2+8,y-4);}
  // best line
  if(best>0){const y=PLAT_Y-best*40;ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.setLineDash([14,8]);ctx.beginPath();ctx.moveTo(-W/2,y);ctx.lineTo(W/2,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ffd23f';ctx.textAlign='right';ctx.fillText('BEST',W/2-8,y-5);}
  // platform
  ctx.fillStyle='rgba(29,18,64,.35)';roundRect(-PLAT_W/2,PLAT_Y+5,PLAT_W,30,10);ctx.fill();
  ctx.fillStyle='#fff';roundRect(-PLAT_W/2,PLAT_Y,PLAT_W,30,10);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#1d1240';ctx.stroke();
  ctx.fillStyle='#ff4f8b';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(-PLAT_W/2+20+i*(PLAT_W-40)/5,PLAT_Y+15,5,0,7);ctx.fill();}
  // drop guide
  if(phase==='aim'&&active){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.setLineDash([6,10]);ctx.lineDashOffset=-now/30;
    ctx.beginPath();ctx.moveTo(active.position.x,active.bounds.max.y+6);ctx.lineTo(active.position.x,Math.min(towerTop,PLAT_Y));ctx.stroke();ctx.setLineDash([]);}
  for(const b of blocks)if(b!==active)drawBody(b);
  if(active)drawBody(active);
  // particles
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l-=.025;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;particles=particles.filter(p=>p.l>0);
  ctx.restore();
  // next preview
  if(phase==='aim'&&nextShape){const x=W-46-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sr'))||0),y=H*0.5;
    ctx.fillStyle='rgba(29,18,64,.6)';roundRect(x-34,y-40,68,80,16);ctx.fill();
    ctx.fillStyle='#fff';ctx.font="13px 'Lilita One',sans-serif";ctx.textAlign='center';ctx.fillText('NEXT',x,y-24);
    ctx.save();ctx.translate(x,y+8);const s=0.45;ctx.scale(s,s);ctx.fillStyle=nextShape.c;ctx.strokeStyle='#1d1240';ctx.lineWidth=7;
    const sh=nextShape;ctx.beginPath();
    if(sh.k==='rect')ctx.rect(-sh.w/2,-sh.h/2,sh.w,sh.h);
    else if(sh.k==='circ')ctx.arc(0,0,sh.r,0,7);
    else if(sh.k==='poly'){for(let i=0;i<sh.n;i++){const a=-Math.PI/2+i*2*Math.PI/sh.n;ctx.lineTo(Math.cos(a)*sh.r,Math.sin(a)*sh.r);}ctx.closePath();}
    else if(sh.k==='trap'){const t=sh.w*(1-sh.sl)/2;ctx.moveTo(-sh.w/2,sh.h/2);ctx.lineTo(sh.w/2,sh.h/2);ctx.lineTo(t,-sh.h/2);ctx.lineTo(-t,-sh.h/2);ctx.closePath();}
    else{const s2=sh.s;ctx.moveTo(-1.5*s2,s2/2);ctx.lineTo(1.5*s2,s2/2);ctx.lineTo(1.5*s2,-s2/2);ctx.lineTo(-.5*s2,-s2/2);ctx.lineTo(-.5*s2,-1.5*s2);ctx.lineTo(-1.5*s2,-1.5*s2);ctx.closePath();}
    ctx.fill();ctx.stroke();ctx.restore();}
  // live height
  if(phase!=='menu'&&now%10<1)$('height').textContent=heightM().toFixed(1);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
setInterval(()=>{if(engine&&phase!=='menu')$('height').textContent=heightM().toFixed(1)},250);
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0;});
window.__ps={get gx(){return engine?engine.gravity.x:0},get tilt(){return tiltActive()},get phase(){return phase},get players(){return players},get cur(){return cur},drop,get blocks(){return blocks}};
requestAnimationFrame(frame);
// show tilt state after first frame (button only after user has tapped Play)
setTimeout(()=>{if(typeof DeviceOrientationEvent==='undefined')tiltState='unavailable';},0);
})();
</script>
</body>
</html>
